<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'"><title>RL Manager · Loading</title><style>
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:#080f16;color:#fff;font-family:'Segoe UI',sans-serif;-webkit-app-region:drag}.art{position:absolute;inset:0;background:url('brand/arena-background.png') center/cover}.shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(3,9,16,.98),transparent 55%)}.loading{position:absolute;left:6%;right:6%;bottom:8%}.meta{display:flex;align-items:end;justify-content:space-between;margin-bottom:15px}.eyebrow{font-size:10px;letter-spacing:3px;color:#ffa931;margin-bottom:9px}#message{font-size:14px;color:#e1e7ed}#percent{font-size:34px;font-weight:650;font-variant-numeric:tabular-nums}#percent small{font-size:14px;color:#a7b2bd}.rail{height:5px;background:#ffffff25;border-radius:8px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#ed7809,#ffcd69);box-shadow:0 0 22px #ff9c26;transition:width .6s cubic-bezier(.2,.8,.2,1);position:relative}.fill:after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,#fff9 50%,transparent 80%);animation:glint 1.8s infinite}.foot{display:flex;justify-content:space-between;margin-top:14px;color:#a9b3be;font-size:10px;letter-spacing:1px}.close{position:absolute;right:16px;top:12px;border:1px solid #ffffff20;background:#07101bb0;color:#fff;border-radius:50%;width:28px;height:28px;cursor:pointer;-webkit-app-region:no-drag}.error-actions{display:none;gap:12px;margin-top:14px;-webkit-app-region:no-drag}.error-actions button{background:#ffb342;border:0;padding:8px 16px;border-radius:6px;cursor:pointer}@keyframes glint{from{transform:translateX(-100%)}to{transform:translateX(100%)}}@media(prefers-reduced-motion:reduce){.fill:after{animation:none}.fill{transition:none}}
</style></head><body><div class="art"></div><div class="shade"></div><button class="close" aria-label="Close RL Manager">×</button><section class="loading" aria-label="Loading RL Manager"><div class="meta"><div><div class="eyebrow">YOUR CLUB. YOUR STORY.</div><div id="message" role="status">Warming up the arena</div></div><div id="percent">0<small>%</small></div></div><div class="rail" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill"></div></div><div class="foot"><span>RL MANAGER</span><span id="hint">PREPARING YOUR NEXT CHAPTER</span></div><div class="error-actions"><button id="logs">Open support logs</button><button id="quit">Close game</button></div></section><script src="splash.js"></script></body></html>
